<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>You're offline · Shed</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#141414;--canvas:#F6F5F2;--line:#E7E5E0;--subtle:#6B6B6B;--brand:#FF9800}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;
      background:var(--canvas);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
    .logo{height:40px;width:auto}
    .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
    .icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:#FFF3E0;display:flex;align-items:center;justify-content:center}
    h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
    p{margin-top:10px;color:var(--subtle);line-height:1.55}
    .btn{margin-top:24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:12px;
      background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
    .btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
    .tips{margin-top:18px;font-size:.875rem;color:var(--subtle)}
    .status{font-size:.8125rem;color:var(--subtle)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#D93025;margin-right:6px;vertical-align:middle}
    .online .dot{background:#1E8E3E}
  </style>
</head>
<body>
  <img class="logo" src="/brand/shed-logo.png" alt="Shed" width="129" height="40">
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>This page isn't available without a connection. Check your data or Wi‑Fi and try again — pages you've opened before will still load.</p>
    <button class="btn" type="button" onclick="location.reload()">Try again</button>
    <p class="tips">Your cart is saved on this device and will be there when you're back.</p>
  </main>
  <p class="status" id="status" role="status"><span class="dot"></span>No connection</p>
  <script>
    (function () {
      var s = document.getElementById('status');
      function update() {
        if (navigator.onLine) { s.className = 'status online'; s.innerHTML = '<span class="dot"></span>Back online — reloading…'; setTimeout(function () { location.reload(); }, 600); }
      }
      window.addEventListener('online', update);
    })();
  </script>
</body>
</html>
