<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shed — You're Offline</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: 'Jost', sans-serif;
      color: #fff;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,139,139,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo { margin-bottom: 32px; }
    .logo img {
      height: 40px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }

    .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(0,139,139,0.12);
      border: 1px solid rgba(0,139,139,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }

    .slash {
      position: absolute;
      width: 2.5px; height: 42px;
      background: #e74c3c;
      border-radius: 2px;
      transform: rotate(45deg);
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }

    p {
      font-size: 0.92rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.65;
      margin-bottom: 32px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #008B8B;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'Jost', sans-serif;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
    }
    .btn-retry:hover  { background: #006f6f; }
    .btn-retry:active { transform: scale(0.97); }

    .status-bar {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .status-dot.online { background: #2ecc71; animation: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/images/logo.png" alt="Shed">
    </div>

    <div class="icon-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#008B8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>It looks like your internet connection is unavailable. Check your connection and try again.</p>

    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 .49-3.34"></path>
      </svg>
      Try again
    </button>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">No connection</span>
    </div>
  </div>

  <script>
    function updateStatus() {
      const dot  = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Back online — reloading…';
        setTimeout(() => window.location.reload(), 800);
      } else {
        dot.classList.remove('online');
        text.textContent = 'No connection';
      }
    }
    window.addEventListener('online',  updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
